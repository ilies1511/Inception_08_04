
services:
  nginx:
    build: requirements/nginx/
    container_name: nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    restart: always
  wordpress:
    build: requirements/wordpress/
    container_name: wordpress
    volumes:
      - wordpress:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_DATABASE : ${DATABASE}
      DB_WPUSER : ${WPUSER}
      DB_WPPASS : ${WPPASS}
      DB_ADMIN_WPUSER : ${ADMIN_WPUSER}
      DB_ADMIN_WPPASS : ${ADMIN_WPPASS}
      DB_ADMIN_EMAIL : ${ADMIN_EMAIL}
      DB_ROOT_PASSWORD : ${ROOT_PASSWORD}
      DB_SECOND_WPUSER: ${SECOND_WPUSER}
      DB_SECOND_WPPASS: ${SECOND_WPPASS}
      DB_SECOND_EMAIL: ${SECOND_EMAIL}
      DB_SECOND_ROLE: ${SECOND_ROLE}
      MYSQL_ROOT_PASS: ${MYSQL_PASS}
    networks:
      - inception
    restart: always
  mariadb:
        #  test: [ "CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized" ]
    healthcheck:
      test: [ "CMD" , "mariadb-check", "wordpress"]
      interval: 5s
      retries: 3
    build: requirements/mariadb/
    container_name: mariadb
    volumes:
      - mariadb:/var/lib/mysql
    environment:
      DB_DATABASE : ${DATABASE}
      DB_WPUSER : ${WPUSER}
      DB_WPPASS : ${WPPASS}
      DB_ADMIN_WPUSER : ${ADMIN_WPUSER}
      DB_ADMIN_WPPASS : ${ADMIN_WPPASS}
      DB_ADMIN_EMAIL : ${ADMIN_EMAIL}
      DB_ROOT_PASSWORD : ${ROOT_PASSWORD}
      DB_SECOND_WPUSER: ${SECOND_WPUSER}
      DB_SECOND_WPPASS: ${SECOND_WPPASS}
      DB_SECOND_EMAIL: ${SECOND_EMAIL}
      DB_SECOND_ROLE: ${SECOND_ROLE}
      MYSQL_ROOT_PASS: ${MYSQL_PASS}
    networks:
      - inception
    restart: always

networks:
  inception:
    name: inception

# Nachher in VM
volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      device: /home/iziane/data/mariadb
      o: bind
      type: none
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      device: /home/iziane/data/wordpress
      o: bind
      type: none
