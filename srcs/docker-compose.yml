
services:
  nginx:
    build: requirements/nginx/
    container_name: nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - "./web:/var/www/html"
    networks:
      - inception
    restart: always
  wordpress:
    build: requirements/wordpress/
    container_name: wordpress
    volumes:
      - "./web:/var/www/html"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_DATABASE : ${DATABASE}
      DB_WPUSER : ${WPUSER}
      DB_WPPASS : ${WPPASS}
    networks:
      - inception
    restart: always
  mariadb:
        #  test: [ "CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized" ]
    healthcheck:
      test: [ "CMD" , "mariadb-check", "wordpress"]
      interval: 5s
      retries: 3
    build: requirements/mariadb/
    container_name: mariadb
    volumes:
      - "./db:/var/lib/mysql"
    environment:
      DB_DATABASE : ${DATABASE}
      DB_WPUSER : ${WPUSER}
      DB_WPPASS : ${WPPASS}
    networks:
      - inception
    restart: always

networks:
  inception:
    name: inception
