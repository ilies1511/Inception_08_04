
services:
  nginx:
    build: requirements/nginx/
    container_name: nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - "./web:/var/www/html"
    networks:
      default: {}
  wordpress:
    build: requirements/wordpress/
    container_name: wordpress
    volumes:
      - "./web:/var/www/html"
    depends_on:
      - mariadb
    environment:
      DATABASE : ${DATABASE}
      WPUSER : ${WPUSER}
      WPPASS : ${WPPASS}
    networks:
      default: {}
  mariadb:
    build: requirements/mariadb/
    container_name: mariadb
    volumes:
      - "./db:/var/lib/mysql"
    environment:
      DATABASE : ${DATABASE}
      WPUSER : ${WPUSER}
      WPPASS : ${WPPASS}
    networks:
      default: {}

networks:
  default:
    name: Inception
